name: CI

on:
  push:
    branches:
      - dev/oae-v0.1
  pull_request:
    branches:
      - dev/oae-v0.1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify frozen specification manifest
        run: sha256sum -c docs/specs/SPEC_MANIFEST.sha256

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[test]"

      - name: Verify package import
        run: python -c "import oae; print(oae.__file__)"

      - name: Run tests
        run: python -m pytest
